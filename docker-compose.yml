# Local development stack. Spins up Postgres + Conduit.
# For production, point DATABASE_URL at your managed Postgres and
# inject secrets via your platform's secret manager (e.g. ESO + AWS SM).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    ports:
      - "5432:5432"
    volumes:
      - conduit-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 5s
      timeout: 5s
      retries: 10

  conduit:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7456:7456"
    environment:
      DATABASE_URL: postgres://conduit:conduit@postgres:5432/conduit
      DATABASE_SSL: disable
      PORT: "7456"
      CONDUIT_DATA_DIR: /data
      # REQUIRED in any deployment reached via a hostname other than
      # http://localhost:7456 (i.e. all real/prod deployments, esp. multi-pod):
      # the canonical public URL. MCP OAuth redirect URIs are built from this and
      # MUST be byte-stable, or providers reject reconnects ("Mismatching redirect
      # URI" — Datadog). Unset ⇒ derived from the (variable) browser origin.
      # CONDUIT_BASE_URL: https://conduit.example.com
      # Optional:
      # GITHUB_PAT: ghp_xxx
      # SLACK_SIGNING_SECRET: xxx
      # SENTRY_DSN: https://xxx@sentry.io/yyy
      # CONDUIT_ALLOWED_IPS: 127.0.0.1,10.0.0.0/8
      # Remote worker mode — uncomment BOTH lines when using the `worker`
      # profile below (token must match the worker's):
      # CONDUIT_WORKER_FACTORY: remote
      # CONDUIT_WORKER_TOKEN: dev-worker-token
    volumes:
      - conduit-data:/data

  # Standalone execution worker (remote factory mode). Not started by default;
  # bring the stack up with:
  #   docker compose --profile worker up
  # and uncomment CONDUIT_WORKER_FACTORY/CONDUIT_WORKER_TOKEN on the conduit
  # service above. Same image, worker entrypoint — execution happens in this
  # container; the server only orchestrates. Scale out with more replicas or
  # additional hosts pointing CONDUIT_SERVER_URL at the server.
  worker:
    profiles: ["worker"]
    build: .
    depends_on:
      - conduit
    entrypoint: ["node", "out/worker/index.js"]
    environment:
      CONDUIT_SERVER_URL: ws://conduit:7456/ws/worker
      CONDUIT_WORKER_TOKEN: dev-worker-token

volumes:
  conduit-pg-data:
  conduit-data:
